---
- name: Deploy Inactive Users Disabler on Windows (Domain & Local)
  hosts: all
  gather_facts: false

  tasks:
    # -------------------------------------------------------------
    # LEVEL 1 SAFETY GUARD: Windows OS Verification
    # -------------------------------------------------------------
    - name: "[Windows Safety Guard] Detect Windows target"
      when: os_type | default('linux') == 'windows'
      ansible.builtin.raw: >
        powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "if ((Get-CimInstance Win32_OperatingSystem -ErrorAction SilentlyContinue) -or (Get-WmiObject Win32_OperatingSystem -ErrorAction SilentlyContinue)) { Write-Output 'WINDOWS_VERIFIED' } else { Write-Error 'WINDOWS_DETECTION_FAILED'; exit 20 }"
      register: windows_check_res
      changed_when: false
      failed_when: >
        windows_check_res.rc != 0 or
        'WINDOWS_VERIFIED' not in windows_check_res.stdout

    # -------------------------------------------------------------
    # PREPARE DIRECTORY
    # -------------------------------------------------------------
    - name: "[Windows] Ensure C:\\Windows\\Scripts\\inactive_users directory"
      when:
        - os_type | default('linux') == 'windows'
        - "'WINDOWS_VERIFIED' in windows_check_res.stdout"
      vars:
        create_dir_script: |
          $dir = 'C:\Windows\Scripts\inactive_users'
          if (-not (Test-Path -LiteralPath $dir)) {
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Write-Output 'DIR_CREATED'
          } else {
            Write-Output 'DIR_EXISTS'
          }
          exit 0
      ansible.builtin.raw: >
        powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand {{ create_dir_script | b64encode(encoding='utf-16-le') }}
      register: dir_res
      changed_when: "'DIR_CREATED' in dir_res.stdout"

    # -------------------------------------------------------------
    # DEPLOY excluded_users.txt
    # -------------------------------------------------------------
    - name: "[Windows] Deploy excluded_users.txt"
      when:
        - os_type | default('linux') == 'windows'
        - "'WINDOWS_VERIFIED' in windows_check_res.stdout"
      vars:
        deploy_excl_script: |
          $b64 = '{{ excluded_users_content | default('') | b64encode }}'
          $bytes = [System.Convert]::FromBase64String($b64)
          $text = [System.Text.Encoding]::UTF8.GetString($bytes)
          $target = 'C:\Windows\Scripts\inactive_users\excluded_users.txt'
          $utf8Bom = New-Object System.Text.UTF8Encoding($true)
          [System.IO.File]::WriteAllText($target, $text, $utf8Bom)
          if (-not (Test-Path -LiteralPath $target)) {
            Write-Error 'EXCLUSIONS_FILE_NOT_CREATED'
            exit 30
          }
          Write-Output 'EXCLUSIONS_WRITTEN'
          exit 0
      ansible.builtin.raw: >
        powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand {{ deploy_excl_script | b64encode(encoding='utf-16-le') }}
      register: excl_res
      changed_when: "'EXCLUSIONS_WRITTEN' in excl_res.stdout"

    # -------------------------------------------------------------
    # DEPLOY disable_inactive_users.ps1
    # -------------------------------------------------------------
    - name: "[Windows] Deploy disable_inactive_users.ps1"
      when:
        - os_type | default('linux') == 'windows'
        - "'WINDOWS_VERIFIED' in windows_check_res.stdout"
      vars:
        deploy_ps_script: |
          $b64 = '{{ disable_script_content | default('') | b64encode }}'
          $bytes = [System.Convert]::FromBase64String($b64)
          $text = [System.Text.Encoding]::UTF8.GetString($bytes)
          $target = 'C:\Windows\Scripts\inactive_users\disable_inactive_users.ps1'
          $utf8Bom = New-Object System.Text.UTF8Encoding($true)
          [System.IO.File]::WriteAllText($target, $text, $utf8Bom)
          if (-not (Test-Path -LiteralPath $target)) {
            Write-Error 'SCRIPT_FILE_NOT_CREATED'
            exit 31
          }
          $size = (Get-Item -LiteralPath $target).Length
          if ($size -le 0) {
            Write-Error 'SCRIPT_FILE_EMPTY'
            exit 32
          }
          # Clean up legacy local script if exists
          $legacyPath = 'C:\Windows\Scripts\inactive_users\disable_inactive_users_local.ps1'
          if (Test-Path -LiteralPath $legacyPath) {
            Remove-Item -LiteralPath $legacyPath -Force -ErrorAction SilentlyContinue
          }
          Write-Output ('SCRIPT_WRITTEN: ' + $size + ' bytes')
          exit 0
      ansible.builtin.raw: >
        powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand {{ deploy_ps_script | b64encode(encoding='utf-16-le') }}
      register: script_res
      changed_when: "'SCRIPT_WRITTEN:' in script_res.stdout"

    # -------------------------------------------------------------
    # LOCK ACL
    # SYSTEM + BUILTIN\Administrators
    # -------------------------------------------------------------
    - name: "[Windows] Lock ACL to SYSTEM and Builtin Administrators"
      when:
        - os_type | default('linux') == 'windows'
        - "'WINDOWS_VERIFIED' in windows_check_res.stdout"
      vars:
        acl_script: |
          $folder = 'C:\Windows\Scripts\inactive_users'
          $acl = Get-Acl -LiteralPath $folder
          $rules = @($acl.Access)
          foreach ($r in $rules) { try { $null = $acl.RemoveAccessRule($r) } catch {} }
          $ruleSys = New-Object System.Security.AccessControl.FileSystemAccessRule('NT AUTHORITY\SYSTEM', 'FullControl', 'ContainerInherit,ObjectInherit', 'None', 'Allow')
          $ruleAdm = New-Object System.Security.AccessControl.FileSystemAccessRule('BUILTIN\Administrators', 'FullControl', 'ContainerInherit,ObjectInherit', 'None', 'Allow')
          $acl.SetAccessRule($ruleSys)
          $acl.SetAccessRule($ruleAdm)
          Set-Acl -LiteralPath $folder -AclObject $acl
          Write-Output 'ACL_PROTECTED'
          exit 0
      ansible.builtin.raw: >
        powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand {{ acl_script | b64encode(encoding='utf-16-le') }}
      register: acl_res
      changed_when: "'ACL_PROTECTED' in acl_res.stdout"

    # -------------------------------------------------------------
    # REGISTER UNIVERSAL SCHEDULED TASK
    # Task: Disable Inactive Users (runs Daily at 00:00 as SYSTEM)
    # -------------------------------------------------------------
    - name: "[Windows] Register Scheduled Task at 00:00"
      when:
        - os_type | default('linux') == 'windows'
        - "'WINDOWS_VERIFIED' in windows_check_res.stdout"
      vars:
        register_task_script: |
          $taskName = 'Disable Inactive Users'
          $scriptPath = 'C:\Windows\Scripts\inactive_users\disable_inactive_users.ps1'
          if (-not (Test-Path -LiteralPath $scriptPath)) {
            Write-Error 'SCRIPT_NOT_FOUND'
            exit 40
          }
          # Clean up legacy task name if present
          try {
            Unregister-ScheduledTask -TaskName 'Disable Inactive Local Users' -Confirm:$false -ErrorAction SilentlyContinue
          } catch {}

          if (Get-Command -Name 'Register-ScheduledTask' -ErrorAction SilentlyContinue) {
            $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument '-NoProfile -ExecutionPolicy Bypass -File C:\Windows\Scripts\inactive_users\disable_inactive_users.ps1'
            $trigger = New-ScheduledTaskTrigger -Daily -At '00:00'
            $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
            $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable
            Register-ScheduledTask -TaskName $taskName -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force | Out-Null
            Write-Output 'TASK_REGISTERED'
            exit 0
          } else {
            schtasks.exe /Create /F /TN "$taskName" /RU "NT AUTHORITY\SYSTEM" /RL HIGHEST /SC DAILY /ST 00:00 /TR "powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\Windows\Scripts\inactive_users\disable_inactive_users.ps1"
            if ($LASTEXITCODE -eq 0) {
              Write-Output 'TASK_REGISTERED'
              exit 0
            } else {
              exit $LASTEXITCODE
            }
          }
      ansible.builtin.raw: >
        powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand {{ register_task_script | b64encode(encoding='utf-16-le') }}
      register: task_reg_res
      changed_when: "'TASK_REGISTERED' in task_reg_res.stdout"

    # -------------------------------------------------------------
    # QUERY SCHEDULED TASK STATUS
    # -------------------------------------------------------------
    - name: "[Windows] Query Scheduled Task Status"
      when:
        - os_type | default('linux') == 'windows'
        - "'WINDOWS_VERIFIED' in windows_check_res.stdout"
      vars:
        query_task_script: |
          try {
            $t = Get-ScheduledTask -TaskName 'Disable Inactive Users' -ErrorAction Stop
            $info = Get-ScheduledTaskInfo -TaskName 'Disable Inactive Users' -ErrorAction SilentlyContinue
            Write-Output ('TASK_STATUS: State=' + $t.State + ' | NextRun=' + $info.NextRunTime + ' | LastRun=' + $info.LastRunTime + ' | LastResult=' + $info.LastTaskResult)
            exit 0
          } catch {
            schtasks.exe /Query /TN 'Disable Inactive Users' /FO LIST /V
            exit 0
          }
      ansible.builtin.raw: >
        powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand {{ query_task_script | b64encode(encoding='utf-16-le') }}
      register: task_status_res
      changed_when: false
