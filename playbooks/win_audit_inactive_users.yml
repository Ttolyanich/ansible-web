---
- name: Audit Inactive Users Disabler on Windows
  hosts: all
  gather_facts: false

  tasks:
    - name: "[Windows Audit] Check Inactive Users Task and Configuration"
      when: os_type | default('linux') == 'windows'
      ansible.builtin.raw: >
        powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "
        $res = @{
          IsDC = $false;
          DirExists = $false;
          ExclusionsCount = 0;
          ScriptExists = $false;
          TaskInstalled = $false;
          TaskState = 'NotInstalled';
          LastRun = 'Never';
          NextRun = 'None';
          LastLogSummary = 'No logs'
        };

        try {
          $os = Get-CimInstance Win32_OperatingSystem -ErrorAction SilentlyContinue
          if (-not $os) { $os = Get-WmiObject Win32_OperatingSystem -ErrorAction SilentlyContinue }
          if ($os.ProductType -eq 2) { $res.IsDC = $true }
        } catch {}

        if ($res.IsDC) {
          Write-Output 'AUDIT: Target is an Active Directory Domain Controller (ProductType=2). Inactive users disabler should NOT be deployed here.';
          return;
        }

        $dir = 'C:\Windows\Scripts\inactive_users';
        $res.DirExists = Test-Path $dir;
        $exclPath = Join-Path $dir 'excluded_users.txt';
        if (Test-Path $exclPath) {
          $lines = Get-Content $exclPath | Where-Object { $_.Trim() -ne '' -and $_.Trim() -notlike '#*' };
          $res.ExclusionsCount = $lines.Count;
        }

        $scriptPath = Join-Path $dir 'disable_inactive_users_local.ps1';
        $res.ScriptExists = Test-Path $scriptPath;

        try {
          $t = Get-ScheduledTask -TaskName 'Disable Inactive Local Users' -ErrorAction Stop;
          $res.TaskInstalled = $true;
          $res.TaskState = [string]$t.State;
          $info = Get-ScheduledTaskInfo -TaskName 'Disable Inactive Local Users' -ErrorAction SilentlyContinue;
          if ($info) {
            $res.LastRun = [string]$info.LastRunTime;
            $res.NextRun = [string]$info.NextRunTime;
          }
        } catch {
          $res.TaskInstalled = $false;
          $res.TaskState = 'NotInstalled';
        }

        $logPath = Join-Path $dir 'DisabledUsersLog.txt';
        if (Test-Path $logPath) {
          $lastLines = Get-Content $logPath -Tail 3 -ErrorAction SilentlyContinue;
          if ($lastLines) { $res.LastLogSummary = ($lastLines -join ' | ') }
        }

        Write-Output ('AUDIT_RESULT: Task=' + $res.TaskState + ' | Exclusions=' + $res.ExclusionsCount + ' | Script=' + $res.ScriptExists + ' | NextRun=' + $res.NextRun + ' | LastRun=' + $res.LastRun + ' | LastLog=[' + $res.LastLogSummary + ']');
        "
      register: audit_res
      changed_when: false
