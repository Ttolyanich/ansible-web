---
- name: Audit Inactive Users Disabler on Windows
  hosts: all
  gather_facts: false

  tasks:
    - name: "[Windows Audit] Check Inactive Users Task and Configuration"
      when: os_type | default('linux') == 'windows'
      vars:
        audit_script: |
          $res = @{
            Mode = 'Unknown'
            DirExists = $false
            ExclusionsCount = 0
            ScriptExists = $false
            TaskInstalled = $false
            TaskState = 'NotInstalled'
            LastRun = 'Never'
            NextRun = 'None'
            LastLogSummary = 'No logs'
          }

          try {
            $os = Get-CimInstance Win32_OperatingSystem -ErrorAction SilentlyContinue
            if (-not $os) { $os = Get-WmiObject Win32_OperatingSystem -ErrorAction SilentlyContinue }
            if ($os.ProductType -eq 2) {
              $res.Mode = 'DomainController'
            } elseif ($os.ProductType -eq 1 -or $os.ProductType -eq 3) {
              $res.Mode = 'MemberServer'
            } else {
              $res.Mode = "ProductType_$($os.ProductType)"
            }
          } catch {
            $res.Mode = 'DetectFailed'
          }

          $dir = 'C:\Windows\Scripts\inactive_users'
          $res.DirExists = Test-Path $dir
          $exclPath = Join-Path $dir 'excluded_users.txt'
          if (Test-Path $exclPath) {
            $allLines = Get-Content $exclPath -ErrorAction SilentlyContinue
            $valid = 0
            foreach ($l in $allLines) {
              if ($l.Trim() -ne '' -and -not $l.Trim().StartsWith('#')) { $valid++ }
            }
            $res.ExclusionsCount = $valid
          }

          $scriptPath = Join-Path $dir 'disable_inactive_users.ps1'
          $legacyScriptPath = Join-Path $dir 'disable_inactive_users_local.ps1'
          $res.ScriptExists = (Test-Path $scriptPath) -or (Test-Path $legacyScriptPath)

          $taskNames = @('Disable Inactive Users', 'Disable Inactive Local Users')
          foreach ($tn in $taskNames) {
            try {
              $t = Get-ScheduledTask -TaskName $tn -ErrorAction Stop
              $res.TaskInstalled = $true
              $res.TaskState = [string]$t.State
              $info = Get-ScheduledTaskInfo -TaskName $tn -ErrorAction SilentlyContinue
              if ($info) {
                $res.LastRun = [string]$info.LastRunTime
                $res.NextRun = [string]$info.NextRunTime
              }
              break
            } catch {}
          }

          $logPath = Join-Path $dir 'disable_inactive_users.log'
          $legacyLogPath = Join-Path $dir 'DisabledUsersLog.txt'
          $actualLog = if (Test-Path $logPath) { $logPath } elseif (Test-Path $legacyLogPath) { $legacyLogPath } else { $null }
          if ($actualLog) {
            $lastLines = Get-Content $actualLog -Tail 3 -ErrorAction SilentlyContinue
            if ($lastLines) { $res.LastLogSummary = ($lastLines -join ' | ') }
          }

          Write-Output ('AUDIT_RESULT: Mode=' + $res.Mode + ' | Task=' + $res.TaskState + ' | Exclusions=' + $res.ExclusionsCount + ' | Script=' + $res.ScriptExists + ' | NextRun=' + $res.NextRun + ' | LastRun=' + $res.LastRun + ' | LastLog=[' + $res.LastLogSummary + ']')
          exit 0
      ansible.builtin.raw: >
        powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand {{ audit_script | b64encode(encoding='utf-16-le') }}
      register: audit_res
      changed_when: false

    - name: "[Windows Audit] Audit Summary"
      when:
        - os_type | default('linux') == 'windows'
        - audit_res is defined
      ansible.builtin.debug:
        msg: "{{ audit_res.stdout_lines | default([]) }}"
