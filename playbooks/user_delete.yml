---
- name: Revoke Access or Remove Accounts on Linux & Windows
  hosts: all
  gather_facts: false

  tasks:
    - name: Normalize target users list
      ansible.builtin.set_fact:
        effective_users: >-
          {{
            target_users if (target_users is defined and target_users is iterable and target_users | length > 0)
            else [{'username': target_username}]
          }}
        is_permanent_delete: "{{ permanent_delete | default(false) | bool }}"

    - name: "[Safety Policy] Guard against deleting protected system accounts"
      ansible.builtin.assert:
        that:
          - item.username | lower not in ['ansible', 'root', 'admin', 'administrator', 'system']
        fail_msg: "CRITICAL: Operation on protected system user '{{ item.username }}' is strictly forbidden by safety policy!"
      loop: "{{ effective_users }}"

    # -------------------------------------------------------------
    # LINUX TARGETS
    # -------------------------------------------------------------
    - name: "[Linux / Safety Guard] Terminate user processes (UID >= 1000 only)"
      when: os_type | default('linux') == 'linux'
      ansible.builtin.raw: >
        sh -c '
        TARGET_USER="{{ item.username }}";
        TARGET_UID=$(id -u "$TARGET_USER" 2>/dev/null || true);
        if [ -n "$TARGET_UID" ]; then
          if [ "$TARGET_UID" -ge 1000 ]; then
            pkill -9 -u "$TARGET_UID" 2>/dev/null || true;
            echo "KILLED_UID_$TARGET_UID";
          else
            echo "SKIP_KILL_SYSTEM_UID_$TARGET_UID";
          fi;
        else
          echo "USER_NOT_PRESENT";
        fi
        '
      loop: "{{ effective_users }}"
      changed_when: false

    - name: "[Linux] Remove sudoers drop-in files"
      when: os_type | default('linux') == 'linux'
      ansible.builtin.raw: >
        sh -c 'rm -f "/etc/sudoers.d/{{ item.username }}" "/etc/sudoers.d/{{ item.username | replace(".", "_") }}" 2>/dev/null || true'
      loop: "{{ effective_users }}"
      changed_when: false

    # Safe Revoke Mode (Disable & strip groups)
    - name: "[Linux / Safe Revoke] Lock account, expire, disable shell and strip groups"
      when:
        - os_type | default('linux') == 'linux'
        - not is_permanent_delete
      ansible.builtin.raw: >
        sh -c '
        U="{{ item.username }}";
        if ! id "$U" >/dev/null 2>&1; then
          echo "USER_ALREADY_ABSENT";
          exit 0;
        fi;
        (usermod -L -e 1 "$U" 2>/dev/null || passwd -l "$U" 2>/dev/null) && \
        (usermod -s /sbin/nologin "$U" 2>/dev/null || usermod -s /usr/sbin/nologin "$U" 2>/dev/null || true) && \
        (usermod -G "" "$U" 2>/dev/null || true);
        for g in sudo wheel admin docker adm lxd; do
          gpasswd -d "$U" "$g" 2>/dev/null || true;
        done;
        if [ -f "/home/$U/.ssh/authorized_keys" ]; then
          mv -f "/home/$U/.ssh/authorized_keys" "/home/$U/.ssh/authorized_keys.disabled" 2>/dev/null || true;
        fi;
        echo "REVOKE_SUCCESS"
        '
      loop: "{{ effective_users }}"
      register: linux_revoke_res
      changed_when: "'REVOKE_SUCCESS' in linux_revoke_res.stdout"
      failed_when: linux_revoke_res.rc != 0

    # Permanent Delete Mode (userdel -r)
    - name: "[Linux / Permanent Delete] Purge user and home directory"
      when:
        - os_type | default('linux') == 'linux'
        - is_permanent_delete
      ansible.builtin.raw: >
        sh -c '
        U="{{ item.username }}";
        if ! id "$U" >/dev/null 2>&1; then
          echo "USER_ALREADY_DELETED";
          exit 0;
        fi;
        (userdel -r "$U" 2>/dev/null || deluser --remove-home "$U" 2>/dev/null || userdel "$U" 2>/dev/null) && \
        (rm -rf "/home/$U" 2>/dev/null || true);
        echo "DELETE_SUCCESS"
        '
      loop: "{{ effective_users }}"
      register: linux_del_res
      changed_when: "'DELETE_SUCCESS' in linux_del_res.stdout"
      failed_when: linux_del_res.rc != 0

    # -------------------------------------------------------------
    # WINDOWS TARGETS (via OpenSSH)
    # -------------------------------------------------------------
    - name: "[Windows / Fail-Close Safety Policy] Guard against domain controller modification"
      when: os_type | default('linux') == 'windows'
      ansible.builtin.raw: >
        powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "
        try {
          $pt = (Get-CimInstance Win32_OperatingSystem -ErrorAction Stop).ProductType
        } catch {
          try {
            $pt = (Get-WmiObject Win32_OperatingSystem -ErrorAction Stop).ProductType
          } catch {
            Write-Error 'FAILED_DC_VERIFICATION'
            exit 22
          }
        }
        if ($pt -eq 2) {
          Write-Error 'TARGET_IS_DOMAIN_CONTROLLER: User operations are strictly forbidden on Active Directory Domain Controllers!'
          exit 20
        }
        if ($pt -ne 1 -and $pt -ne 3) {
          Write-Error 'UNKNOWN_OS_PRODUCT_TYPE: Fail-close protection triggered.'
          exit 21
        }
        Write-Output 'DC_CHECK_PASSED'
        "
      register: win_dc_guard
      failed_when: win_dc_guard.rc != 0 or 'DC_CHECK_PASSED' not in win_dc_guard.stdout
      changed_when: false

    # Safe Revoke Mode (Disable & strip groups)
    - name: "[Windows / Safe Revoke] Disable local user and remove from privileged groups"
      when:
        - os_type | default('linux') == 'windows'
        - not is_permanent_delete
      ansible.builtin.raw: >
        powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "
        $user = '{{ item.username }}';
        $found = $false;
        try {
          if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) { $found = $true }
        } catch {
          $netOut = net user $user 2>&1
          if ($LASTEXITCODE -eq 0) { $found = $true }
        }
        if (-not $found) {
          Write-Output 'WIN_USER_NOT_FOUND'
          exit 0
        }
        try {
          Disable-LocalUser -Name $user -ErrorAction Stop
        } catch {
          net user $user /active:no 2>&1 | Out-Null
        }
        $adminGroups = @('Administrators', 'Администраторы', 'Remote Desktop Users', 'Пользователи удаленного рабочего стола');
        foreach ($grp in $adminGroups) {
          try { Remove-LocalGroupMember -Group $grp -Member $user -ErrorAction SilentlyContinue } catch {}
          try { net localgroup $grp $user /delete 2>&1 | Out-Null } catch {}
        }
        Write-Output 'WIN_DISABLED_AND_STRIPPED'
        "
      loop: "{{ effective_users }}"
      register: win_revoke_res
      changed_when: "'WIN_DISABLED_AND_STRIPPED' in win_revoke_res.stdout"
      failed_when: win_revoke_res.rc != 0

    # Permanent Delete Mode (net user /delete or Remove-LocalUser)
    - name: "[Windows / Permanent Delete] Delete local user account"
      when:
        - os_type | default('linux') == 'windows'
        - is_permanent_delete
      ansible.builtin.raw: >
        powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "
        $user = '{{ item.username }}';
        try {
          if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name $user -ErrorAction Stop
            Write-Output 'WIN_USER_REMOVED'
            exit 0
          }
        } catch {}
        net user $user /delete
        if ($LASTEXITCODE -eq 0) {
          Write-Output 'WIN_USER_REMOVED'
        } else {
          $err = net user $user 2>&1
          if ($err -match 'The user name could not be found' -or $err -match 'Не удалось найти') {
            Write-Output 'WIN_USER_NOT_FOUND'
          } else {
            exit $LASTEXITCODE
          }
        }
        "
      loop: "{{ effective_users }}"
      register: win_del_res
      changed_when: "'WIN_USER_REMOVED' in win_del_res.stdout"
      failed_when: win_del_res.rc != 0

