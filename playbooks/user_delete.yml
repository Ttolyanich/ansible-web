---
- name: Remove Administrator Account on Linux & Windows
  hosts: all
  gather_facts: false

  tasks:
    - name: Normalize target users list
      ansible.builtin.set_fact:
        effective_users: >-
          {{
            target_users if (target_users is defined and target_users is iterable and target_users | length > 0)
            else [{'username': target_username}]
          }}

    - name: "[Safety Policy] Guard against deleting protected system accounts"
      ansible.builtin.assert:
        that:
          - item.username | lower not in ['ansible', 'root', 'admin', 'administrator', 'system']
        fail_msg: "CRITICAL: Deletion of protected system user '{{ item.username }}' is strictly forbidden by safety policy!"
      loop: "{{ effective_users }}"

    # -------------------------------------------------------------
    # LINUX TARGETS
    # -------------------------------------------------------------
    - name: "[Linux] Kill all running processes of users"
      when: os_type | default('linux') == 'linux'
      ansible.builtin.raw: "pkill -9 -u {{ item.username }} || true"
      loop: "{{ effective_users }}"
      changed_when: false
      failed_when: false

    - name: "[Linux] Remove sudoers drop-in files and delete users"
      when: os_type | default('linux') == 'linux'
      ansible.builtin.raw: >
        sh -c '
        rm -f "/etc/sudoers.d/{{ item.username }}" 2>/dev/null || true;
        userdel -r "{{ item.username }}" 2>/dev/null || deluser --remove-home "{{ item.username }}" 2>/dev/null || userdel "{{ item.username }}" 2>/dev/null || true;
        '
      loop: "{{ effective_users }}"
      register: linux_del_res
      changed_when: false
      failed_when: false

    # -------------------------------------------------------------
    # WINDOWS TARGETS (via OpenSSH)
    # -------------------------------------------------------------
    - name: "[Windows] Delete local users"
      when: os_type | default('linux') == 'windows'
      ansible.builtin.raw: >
        net user {{ item.username }} /delete
      loop: "{{ effective_users }}"
      register: win_del_res
      changed_when: "'command completed successfully' in win_del_res.stdout | lower or win_del_res.rc == 0"
      failed_when: false
