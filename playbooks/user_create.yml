---
- name: Create Administrator Account on Linux & Windows
  hosts: all
  gather_facts: false

  tasks:
    - name: Normalize target users list
      ansible.builtin.set_fact:
        effective_users: >-
          {{
            target_users if (target_users is defined and target_users is iterable and target_users | length > 0)
            else [{'username': target_username, 'ssh_key': target_ssh_key | default(''), 'sudo': target_sudo | default(true) | bool, 'password': target_password | default('')}]
          }}
      no_log: true

    # -------------------------------------------------------------
    # LINUX TARGETS
    # -------------------------------------------------------------
    - name: "[Linux] Ensure users exist with home directory and password"
      when: os_type | default('linux') == 'linux'
      ansible.builtin.raw: >
        sh -c '
        if ! id "{{ item.username }}" >/dev/null 2>&1; then
          useradd -m -s /bin/bash "{{ item.username }}" 2>/dev/null || \
          useradd -m "{{ item.username }}" 2>/dev/null || \
          adduser -D -s /bin/bash "{{ item.username }}" 2>/dev/null || \
          adduser -D "{{ item.username }}" 2>/dev/null || true;
        fi;
        {% if item.password is defined and item.password | length > 0 %}
        echo "{{ item.username }}:{{ item.password }}" | chpasswd 2>/dev/null || echo "{{ item.password }}" | passwd --stdin "{{ item.username }}" 2>/dev/null || true;
        {% endif %}
        '
      loop: "{{ effective_users }}"
      register: linux_user_res
      changed_when: false
      failed_when: false
      no_log: true

    - name: "[Linux] Setup SSH authorized_keys"
      when: 
        - os_type | default('linux') == 'linux'
        - item.ssh_key is defined
        - item.ssh_key | trim | length > 0
      ansible.builtin.raw: >
        sh -c '
        USER_DIR=$(getent passwd "{{ item.username }}" 2>/dev/null | cut -d: -f6 || echo "/home/{{ item.username }}");
        [ -z "$USER_DIR" ] && USER_DIR="/home/{{ item.username }}";
        mkdir -p "$USER_DIR/.ssh" 2>/dev/null;
        chmod 700 "$USER_DIR/.ssh" 2>/dev/null;
        touch "$USER_DIR/.ssh/authorized_keys" 2>/dev/null;
        chmod 600 "$USER_DIR/.ssh/authorized_keys" 2>/dev/null;
        echo "{{ item.ssh_key | trim }}" | while IFS= read -r kline || [ -n "$kline" ]; do
          [ -z "$kline" ] && continue
          if ! grep -qF "$kline" "$USER_DIR/.ssh/authorized_keys" 2>/dev/null; then
            echo "$kline" >> "$USER_DIR/.ssh/authorized_keys"
          fi
        done;
        chown -R "{{ item.username }}" "$USER_DIR/.ssh" 2>/dev/null || true;
        chown "{{ item.username }}" "$USER_DIR" 2>/dev/null || true;
        chmod 750 "$USER_DIR" 2>/dev/null || chmod 755 "$USER_DIR" 2>/dev/null || true;
        '
      loop: "{{ effective_users }}"
      register: linux_key_res
      changed_when: false
      failed_when: false

    - name: "[Linux] Setup user shell, bashrc, and color prompt"
      when: os_type | default('linux') == 'linux'
      ansible.builtin.raw: >
        sh -c '
        USER_DIR=$(getent passwd "{{ item.username }}" 2>/dev/null | cut -d: -f6 || echo "/home/{{ item.username }}");
        [ -z "$USER_DIR" ] && USER_DIR="/home/{{ item.username }}";
        mkdir -p "$USER_DIR" 2>/dev/null;

        # Ensure shell is bash if available
        if command -v bash >/dev/null 2>&1; then
          BASH_PATH="$(command -v bash)";
          usermod -s "$BASH_PATH" "{{ item.username }}" 2>/dev/null || chsh -s "$BASH_PATH" "{{ item.username }}" 2>/dev/null || true;
        fi;

        # Copy skeleton files if missing
        if [ ! -f "$USER_DIR/.bashrc" ] && [ -f /etc/skel/.bashrc ]; then
          cp -a /etc/skel/.bashrc "$USER_DIR/.bashrc" 2>/dev/null || true;
        fi;
        if [ ! -f "$USER_DIR/.profile" ] && [ -f /etc/skel/.profile ]; then
          cp -a /etc/skel/.profile "$USER_DIR/.profile" 2>/dev/null || true;
        fi;
        if [ ! -f "$USER_DIR/.bash_logout" ] && [ -f /etc/skel/.bash_logout ]; then
          cp -a /etc/skel/.bash_logout "$USER_DIR/.bash_logout" 2>/dev/null || true;
        fi;

        # If .bashrc is still missing (distro without skel / Alpine / bare container), create a clean one
        if [ ! -s "$USER_DIR/.bashrc" ]; then
          echo "[ -z \"\$PS1\" ] && return" > "$USER_DIR/.bashrc";
          echo "shopt -s checkwinsize 2>/dev/null" >> "$USER_DIR/.bashrc";
          echo "shopt -s histappend 2>/dev/null" >> "$USER_DIR/.bashrc";
          echo "HISTCONTROL=ignoreboth" >> "$USER_DIR/.bashrc";
          echo "HISTSIZE=10000" >> "$USER_DIR/.bashrc";
          echo "HISTFILESIZE=20000" >> "$USER_DIR/.bashrc";
        fi;

        # Enable force_color_prompt and common aliases in bashrc
        sed -i "s/^#force_color_prompt=yes/force_color_prompt=yes/" "$USER_DIR/.bashrc" 2>/dev/null || true;
        sed -i "s/^#alias ll=/alias ll=/" "$USER_DIR/.bashrc" 2>/dev/null || true;
        sed -i "s/^#alias la=/alias la=/" "$USER_DIR/.bashrc" 2>/dev/null || true;
        sed -i "s/^#alias l=/alias l=/" "$USER_DIR/.bashrc" 2>/dev/null || true;
        sed -i "s/^#alias grep=/alias grep=/" "$USER_DIR/.bashrc" 2>/dev/null || true;
        sed -i "s/^#alias fgrep=/alias fgrep=/" "$USER_DIR/.bashrc" 2>/dev/null || true;
        sed -i "s/^#alias egrep=/alias egrep=/" "$USER_DIR/.bashrc" 2>/dev/null || true;

        # Ensure color PS1 exists if not already present (for CentOS/RHEL/minimal distros)
        if ! grep -q "033\[01;" "$USER_DIR/.bashrc" 2>/dev/null && ! grep -q "force_color_prompt" "$USER_DIR/.bashrc" 2>/dev/null; then
          echo "alias ls=\"ls --color=auto\"" >> "$USER_DIR/.bashrc";
          echo "alias ll=\"ls -laF --color=auto\"" >> "$USER_DIR/.bashrc";
          echo "alias grep=\"grep --color=auto\"" >> "$USER_DIR/.bashrc";
          echo "if [ \"\$(id -u)\" -eq 0 ]; then" >> "$USER_DIR/.bashrc";
          echo "  PS1=\"\\[\\033[01;31m\\]\\u@\\h\\[\\033[00m\\]:\\[\\033[01;34m\\]\\w\\[\\033[00m\\]# \"" >> "$USER_DIR/.bashrc";
          echo "else" >> "$USER_DIR/.bashrc";
          echo "  PS1=\"\\[\\033[01;32m\\]\\u@\\h\\[\\033[00m\\]:\\[\\033[01;34m\\]\\w\\[\\033[00m\\]\\$ \"" >> "$USER_DIR/.bashrc";
          echo "fi" >> "$USER_DIR/.bashrc";
        fi;

        # Ensure ~/.profile sources ~/.bashrc
        if [ ! -f "$USER_DIR/.profile" ]; then
          echo "if [ -n \"\$BASH_VERSION\" ] && [ -f \"\$HOME/.bashrc\" ]; then . \"\$HOME/.bashrc\"; fi" > "$USER_DIR/.profile";
        fi;

        UG="\$(id -gn \"{{ item.username }}\" 2>/dev/null || echo \"{{ item.username }}\")";
        chown \"{{ item.username }}:\$UG\" "$USER_DIR/.bashrc" "$USER_DIR/.profile" "$USER_DIR/.bash_logout" 2>/dev/null || chown \"{{ item.username }}\" "$USER_DIR/.bashrc" "$USER_DIR/.profile" "$USER_DIR/.bash_logout" 2>/dev/null || true;
        chmod 644 "$USER_DIR/.bashrc" "$USER_DIR/.profile" "$USER_DIR/.bash_logout" 2>/dev/null || true;
        '
      loop: "{{ effective_users }}"
      register: linux_bashrc_res
      changed_when: false
      failed_when: false

    - name: "[Linux] Configure sudoers and administrator privileges"
      when: 
        - os_type | default('linux') == 'linux'
        - effective_users | selectattr('sudo', 'defined') | selectattr('sudo', 'equalto', true) | list | length > 0
      ansible.builtin.raw: >
        sh -c '
        command -v sudo >/dev/null 2>&1 || ( (command -v apt-get >/dev/null 2>&1 && apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sudo) || (command -v yum >/dev/null 2>&1 && yum install -y sudo) || (command -v dnf >/dev/null 2>&1 && dnf install -y sudo) || (command -v apk >/dev/null 2>&1 && apk add sudo) );
        mkdir -p /etc/sudoers.d 2>/dev/null && chmod 750 /etc/sudoers.d 2>/dev/null;
        grep -q "includedir /etc/sudoers.d" /etc/sudoers 2>/dev/null || echo "#includedir /etc/sudoers.d" >> /etc/sudoers;
        {% for u in effective_users %}
        {% if u.sudo | default(true) | bool %}
        rm -f "/etc/sudoers.d/{{ u.username }}" 2>/dev/null || true;
        echo "{{ u.username }} ALL=(ALL:ALL) NOPASSWD:ALL" > "/etc/sudoers.d/{{ u.username | replace('.', '_') }}" && chmod 0440 "/etc/sudoers.d/{{ u.username | replace('.', '_') }}";
        usermod -a -G sudo "{{ u.username }}" 2>/dev/null || usermod -a -G wheel "{{ u.username }}" 2>/dev/null || true;
        {% endif %}
        {% endfor %}
        '
      register: linux_sudo_res
      failed_when: false
      changed_when: false

    # -------------------------------------------------------------
    # WINDOWS TARGETS (via OpenSSH)
    # -------------------------------------------------------------
    - name: "[Windows] Create local user and set password"
      when: 
        - os_type | default('linux') == 'windows'
        - item.password is defined
        - item.password | length > 0
      ansible.builtin.raw: >
        net user {{ item.username }} "{{ item.password }}" /add /y /expires:never
      loop: "{{ effective_users }}"
      register: win_user_res
      changed_when: "'command completed successfully' in win_user_res.stdout | lower or win_user_res.rc == 0"
      no_log: true

    - name: "[Windows] Add user to local Administrators group"
      when: 
        - os_type | default('linux') == 'windows'
        - item.sudo | default(true) | bool
      ansible.builtin.raw: >
        net localgroup "Administrators" {{ item.username }} /add
      loop: "{{ effective_users }}"
      register: win_group_res
      changed_when: "'command completed successfully' in win_group_res.stdout | lower or win_group_res.rc == 0"

    - name: "[Windows] Prevent password expiration"
      when: os_type | default('linux') == 'windows'
      ansible.builtin.raw: >
        wmic useraccount where name='{{ item.username }}' set PasswordExpires=FALSE
      loop: "{{ effective_users }}"
      register: win_pass_res
      changed_when: false
