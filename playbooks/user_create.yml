---
- name: Create Administrator Account on Linux & Windows
  hosts: all
  gather_facts: false

  tasks:
    - name: Normalize target users list
      ansible.builtin.set_fact:
        effective_users: >-
          {{
            target_users if (target_users is defined and target_users is iterable and target_users | length > 0)
            else [{'username': target_username, 'ssh_key': target_ssh_key | default(''), 'sudo': target_sudo | default(true) | bool, 'password': target_password | default('')}]
          }}

    # -------------------------------------------------------------
    # LINUX TARGETS
    # -------------------------------------------------------------
    - name: "[Linux] Ensure users exist with home directory and password"
      when: os_type | default('linux') == 'linux'
      ansible.builtin.raw: >
        sh -c '
        if ! id "{{ item.username }}" >/dev/null 2>&1; then
          useradd -m -s /bin/bash "{{ item.username }}" 2>/dev/null || \
          useradd -m "{{ item.username }}" 2>/dev/null || \
          adduser -D -s /bin/bash "{{ item.username }}" 2>/dev/null || \
          adduser -D "{{ item.username }}" 2>/dev/null || true;
        fi;
        {% if item.password is defined and item.password | length > 0 %}
        echo "{{ item.username }}:{{ item.password }}" | chpasswd 2>/dev/null || echo "{{ item.password }}" | passwd --stdin "{{ item.username }}" 2>/dev/null || true;
        {% endif %}
        '
      loop: "{{ effective_users }}"
      register: linux_user_res
      changed_when: false
      failed_when: false

    - name: "[Linux] Setup SSH authorized_keys"
      when: 
        - os_type | default('linux') == 'linux'
        - item.ssh_key is defined
        - item.ssh_key | trim | length > 0
      ansible.builtin.raw: >
        sh -c '
        USER_DIR=$(getent passwd "{{ item.username }}" 2>/dev/null | cut -d: -f6 || echo "/home/{{ item.username }}");
        [ -z "$USER_DIR" ] && USER_DIR="/home/{{ item.username }}";
        mkdir -p "$USER_DIR/.ssh" 2>/dev/null;
        chmod 700 "$USER_DIR/.ssh" 2>/dev/null;
        touch "$USER_DIR/.ssh/authorized_keys" 2>/dev/null;
        chmod 600 "$USER_DIR/.ssh/authorized_keys" 2>/dev/null;
        echo "{{ item.ssh_key | trim }}" | while IFS= read -r kline || [ -n "$kline" ]; do
          [ -z "$kline" ] && continue
          if ! grep -qF "$kline" "$USER_DIR/.ssh/authorized_keys" 2>/dev/null; then
            echo "$kline" >> "$USER_DIR/.ssh/authorized_keys"
          fi
        done;
        chown -R "{{ item.username }}" "$USER_DIR/.ssh" 2>/dev/null || true;
        chown "{{ item.username }}" "$USER_DIR" 2>/dev/null || true;
        chmod 750 "$USER_DIR" 2>/dev/null || chmod 755 "$USER_DIR" 2>/dev/null || true;
        '
      loop: "{{ effective_users }}"
      register: linux_key_res
      changed_when: false
      failed_when: false

    - name: "[Linux] Configure sudoers and administrator privileges"
      when: 
        - os_type | default('linux') == 'linux'
        - effective_users | selectattr('sudo', 'defined') | selectattr('sudo', 'equalto', true) | list | length > 0
      ansible.builtin.raw: >
        sh -c '
        command -v sudo >/dev/null 2>&1 || ( (command -v apt-get >/dev/null 2>&1 && apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sudo) || (command -v yum >/dev/null 2>&1 && yum install -y sudo) || (command -v dnf >/dev/null 2>&1 && dnf install -y sudo) || (command -v apk >/dev/null 2>&1 && apk add sudo) );
        mkdir -p /etc/sudoers.d 2>/dev/null && chmod 750 /etc/sudoers.d 2>/dev/null;
        grep -q "includedir /etc/sudoers.d" /etc/sudoers 2>/dev/null || echo "#includedir /etc/sudoers.d" >> /etc/sudoers;
        {% for u in effective_users %}
        {% if u.sudo | default(true) | bool %}
        echo "{{ u.username }} ALL=(ALL) NOPASSWD: ALL" > "/etc/sudoers.d/{{ u.username }}" && chmod 0440 "/etc/sudoers.d/{{ u.username }}";
        usermod -a -G sudo "{{ u.username }}" 2>/dev/null || usermod -a -G wheel "{{ u.username }}" 2>/dev/null || true;
        {% endif %}
        {% endfor %}
        '
      register: linux_sudo_res
      failed_when: false
      changed_when: false

    # -------------------------------------------------------------
    # WINDOWS TARGETS (via OpenSSH)
    # -------------------------------------------------------------
    - name: "[Windows] Create local user and set password"
      when: 
        - os_type | default('linux') == 'windows'
        - item.password is defined
        - item.password | length > 0
      ansible.builtin.raw: >
        net user {{ item.username }} "{{ item.password }}" /add /y /expires:never
      loop: "{{ effective_users }}"
      register: win_user_res
      changed_when: "'command completed successfully' in win_user_res.stdout | lower or win_user_res.rc == 0"

    - name: "[Windows] Add user to local Administrators group"
      when: 
        - os_type | default('linux') == 'windows'
        - item.sudo | default(true) | bool
      ansible.builtin.raw: >
        net localgroup "Administrators" {{ item.username }} /add
      loop: "{{ effective_users }}"
      register: win_group_res
      changed_when: "'command completed successfully' in win_group_res.stdout | lower or win_group_res.rc == 0"

    - name: "[Windows] Prevent password expiration"
      when: os_type | default('linux') == 'windows'
      ansible.builtin.raw: >
        wmic useraccount where name='{{ item.username }}' set PasswordExpires=FALSE
      loop: "{{ effective_users }}"
      register: win_pass_res
      changed_when: false
