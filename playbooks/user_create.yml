---
- name: Create Administrator Account on Linux & Windows
  hosts: all
  gather_facts: false

  tasks:
    - name: Normalize target users list
      ansible.builtin.set_fact:
        effective_users: >-
          {{
            target_users if (target_users is defined and target_users is iterable and target_users | length > 0)
            else [{'username': target_username, 'ssh_key': target_ssh_key | default(''), 'sudo': target_sudo | default(true) | bool, 'password': target_password | default('')}]
          }}
      no_log: true

    # -------------------------------------------------------------
    # LINUX TARGETS (Single atomic SSH session to avoid connection flood / UFW rate limits)
    # -------------------------------------------------------------
    - name: "[Linux] Ensure users, authorized_keys, bashrc and sudoers"
      when: os_type | default('linux') == 'linux'
      ansible.builtin.raw: >
        sh -c '
        {% for u in effective_users %}
        # 1. User creation
        if ! id "{{ u.username }}" >/dev/null 2>&1; then
          useradd -m -s /bin/bash "{{ u.username }}" 2>/dev/null || \
          useradd -m "{{ u.username }}" 2>/dev/null || \
          adduser -D -s /bin/bash "{{ u.username }}" 2>/dev/null || \
          adduser -D "{{ u.username }}" 2>/dev/null || true;
        fi;
        {% if u.password is defined and u.password | length > 0 %}
        echo "{{ (u.username ~ ':' ~ u.password) | b64encode }}" | base64 -d | chpasswd 2>/dev/null || echo "{{ u.password | b64encode }}" | base64 -d | passwd --stdin "{{ u.username }}" 2>/dev/null || true;
        {% endif %}

        U_DIR=$(getent passwd "{{ u.username }}" 2>/dev/null | cut -d: -f6 || echo "/home/{{ u.username }}");
        [ -z "$U_DIR" ] && U_DIR="/home/{{ u.username }}";
        mkdir -p "$U_DIR" 2>/dev/null;

        # 2. Shell & Environment (.bashrc, .profile, colors, aliases)
        if command -v bash >/dev/null 2>&1; then
          BASH_PATH="$(command -v bash)";
          usermod -s "$BASH_PATH" "{{ u.username }}" 2>/dev/null || chsh -s "$BASH_PATH" "{{ u.username }}" 2>/dev/null || true;
        fi;
        if [ ! -f "$U_DIR/.bashrc" ] && [ -f /etc/skel/.bashrc ]; then
          cp -a /etc/skel/.bashrc "$U_DIR/.bashrc" 2>/dev/null || true;
        fi;
        if [ ! -f "$U_DIR/.profile" ] && [ -f /etc/skel/.profile ]; then
          cp -a /etc/skel/.profile "$U_DIR/.profile" 2>/dev/null || true;
        fi;
        if [ ! -f "$U_DIR/.bash_logout" ] && [ -f /etc/skel/.bash_logout ]; then
          cp -a /etc/skel/.bash_logout "$U_DIR/.bash_logout" 2>/dev/null || true;
        fi;
        if [ ! -s "$U_DIR/.bashrc" ]; then
          echo "[ -z \"\$PS1\" ] && return" > "$U_DIR/.bashrc";
          echo "shopt -s checkwinsize 2>/dev/null" >> "$U_DIR/.bashrc";
          echo "shopt -s histappend 2>/dev/null" >> "$U_DIR/.bashrc";
          echo "HISTCONTROL=ignoreboth" >> "$U_DIR/.bashrc";
          echo "HISTSIZE=10000" >> "$U_DIR/.bashrc";
          echo "HISTFILESIZE=20000" >> "$U_DIR/.bashrc";
        fi;
        sed -i "s/^#force_color_prompt=yes/force_color_prompt=yes/" "$U_DIR/.bashrc" 2>/dev/null || true;
        sed -i "s/^#alias ll=/alias ll=/" "$U_DIR/.bashrc" 2>/dev/null || true;
        sed -i "s/^#alias la=/alias la=/" "$U_DIR/.bashrc" 2>/dev/null || true;
        sed -i "s/^#alias l=/alias l=/" "$U_DIR/.bashrc" 2>/dev/null || true;
        sed -i "s/^#alias grep=/alias grep=/" "$U_DIR/.bashrc" 2>/dev/null || true;
        sed -i "s/^#alias fgrep=/alias fgrep=/" "$U_DIR/.bashrc" 2>/dev/null || true;
        sed -i "s/^#alias egrep=/alias egrep=/" "$U_DIR/.bashrc" 2>/dev/null || true;
        if ! grep -q "033\[01;" "$U_DIR/.bashrc" 2>/dev/null && ! grep -q "force_color_prompt" "$U_DIR/.bashrc" 2>/dev/null; then
          echo "alias ls=\"ls --color=auto\"" >> "$U_DIR/.bashrc";
          echo "alias ll=\"ls -laF --color=auto\"" >> "$U_DIR/.bashrc";
          echo "alias grep=\"grep --color=auto\"" >> "$U_DIR/.bashrc";
          echo "if [ \"\$(id -u)\" -eq 0 ]; then" >> "$U_DIR/.bashrc";
          echo "  PS1=\"\\[\\033[01;31m\\]\\u@\\h\\[\\033[00m\\]:\\[\\033[01;34m\\]\\w\\[\\033[00m\\]# \"" >> "$U_DIR/.bashrc";
          echo "else" >> "$U_DIR/.bashrc";
          echo "  PS1=\"\\[\\033[01;32m\\]\\u@\\h\\[\\033[00m\\]:\\[\\033[01;34m\\]\\w\\[\\033[00m\\]\\$ \"" >> "$U_DIR/.bashrc";
          echo "fi" >> "$U_DIR/.bashrc";
        fi;
        if [ ! -f "$U_DIR/.profile" ]; then
          echo "if [ -n \"\$BASH_VERSION\" ] && [ -f \"\$HOME/.bashrc\" ]; then . \"\$HOME/.bashrc\"; fi" > "$U_DIR/.profile";
        fi;

        # 3. SSH authorized_keys
        {% if u.ssh_key is defined and u.ssh_key | trim | length > 0 %}
        mkdir -p "$U_DIR/.ssh" 2>/dev/null;
        chmod 700 "$U_DIR/.ssh" 2>/dev/null;
        touch "$U_DIR/.ssh/authorized_keys" 2>/dev/null;
        chmod 600 "$U_DIR/.ssh/authorized_keys" 2>/dev/null;
        echo "{{ u.ssh_key | trim }}" | while IFS= read -r kline || [ -n "$kline" ]; do
          [ -z "$kline" ] && continue
          case "$kline" in
            \#*) continue ;;
          esac
          if ! grep -qF "$kline" "$U_DIR/.ssh/authorized_keys" 2>/dev/null; then
            echo "$kline" >> "$U_DIR/.ssh/authorized_keys"
          fi
        done;
        chown -R "{{ u.username }}" "$U_DIR/.ssh" 2>/dev/null || true;
        {% endif %}

        UG="$(id -gn "{{ u.username }}" 2>/dev/null || echo "{{ u.username }}")";
        chown "$U_DIR" 2>/dev/null || true;
        chown "{{ u.username }}:$UG" "$U_DIR/.bashrc" "$U_DIR/.profile" "$U_DIR/.bash_logout" 2>/dev/null || chown "{{ u.username }}" "$U_DIR/.bashrc" "$U_DIR/.profile" "$U_DIR/.bash_logout" 2>/dev/null || true;
        chmod 644 "$U_DIR/.bashrc" "$U_DIR/.profile" "$U_DIR/.bash_logout" 2>/dev/null || true;
        chmod 750 "$U_DIR" 2>/dev/null || chmod 755 "$U_DIR" 2>/dev/null || true;

        echo "USER_{{ u.username }}_CONFIGURED";
        {% endfor %}

        # 4. Sudoers
        {% if effective_users | selectattr('sudo', 'defined') | selectattr('sudo', 'equalto', true) | list | length > 0 %}
        command -v sudo >/dev/null 2>&1 || ( (command -v apt-get >/dev/null 2>&1 && apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sudo) || (command -v yum >/dev/null 2>&1 && yum install -y sudo) || (command -v dnf >/dev/null 2>&1 && dnf install -y sudo) || (command -v apk >/dev/null 2>&1 && apk add sudo) );
        mkdir -p /etc/sudoers.d 2>/dev/null && chmod 750 /etc/sudoers.d 2>/dev/null;
        grep -q "includedir /etc/sudoers.d" /etc/sudoers 2>/dev/null || echo "#includedir /etc/sudoers.d" >> /etc/sudoers;
        {% for u in effective_users %}
        {% if u.sudo | default(true) | bool %}
        rm -f "/etc/sudoers.d/{{ u.username }}" 2>/dev/null || true;
        echo "{{ u.username }} ALL=(ALL:ALL) NOPASSWD:ALL" > "/etc/sudoers.d/{{ u.username | replace('.', '_') }}" && chmod 0440 "/etc/sudoers.d/{{ u.username | replace('.', '_') }}";
        usermod -a -G sudo "{{ u.username }}" 2>/dev/null || usermod -a -G wheel "{{ u.username }}" 2>/dev/null || true;
        {% endif %}
        {% endfor %}
        {% endif %}
        '
      register: linux_provision_res
      changed_when: false
      failed_when: linux_provision_res.rc != 0
      no_log: true

    # -------------------------------------------------------------
    # WINDOWS TARGETS (via OpenSSH)
    # -------------------------------------------------------------
    - name: "[Windows / Fail-Close Safety Policy] Guard against domain controller modification"
      when: os_type | default('linux') == 'windows'
      ansible.builtin.raw: >
        powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "
        try {
          $pt = (Get-CimInstance Win32_OperatingSystem -ErrorAction Stop).ProductType
        } catch {
          try {
            $pt = (Get-WmiObject Win32_OperatingSystem -ErrorAction Stop).ProductType
          } catch {
            Write-Error 'FAILED_DC_VERIFICATION'
            exit 22
          }
        }
        if ($pt -eq 2) {
          Write-Error 'TARGET_IS_DOMAIN_CONTROLLER: Local user creation is strictly forbidden on Active Directory Domain Controllers!'
          exit 20
        }
        if ($pt -ne 1 -and $pt -ne 3) {
          Write-Error 'UNKNOWN_OS_PRODUCT_TYPE: Fail-close protection triggered.'
          exit 21
        }
        Write-Output 'DC_CHECK_PASSED'
        "
      register: win_dc_guard
      failed_when: win_dc_guard.rc != 0 or 'DC_CHECK_PASSED' not in win_dc_guard.stdout
      changed_when: false

    - name: "[Windows] Create local user and set password"
      when: 
        - os_type | default('linux') == 'windows'
        - item.password is defined
        - item.password | length > 0
      ansible.builtin.raw: >
        powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "
        $user = '{{ item.username }}';
        $b64 = '{{ item.password | b64encode }}';
        $bytes = [System.Convert]::FromBase64String($b64);
        $pass = [System.Text.Encoding]::UTF8.GetString($bytes);
        try {
          $sec = ConvertTo-SecureString $pass -AsPlainText -Force
          if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name $user -Password $sec -PasswordNeverExpires $true -AccountNeverExpires $true
          } else {
            New-LocalUser -Name $user -Password $sec -PasswordNeverExpires $true -AccountNeverExpires $true -FullName $user | Out-Null
          }
          Write-Output 'WIN_USER_CONFIGURED'
        } catch {
          net user $user $pass /add /y /expires:never 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            net user $user $pass /expires:never 2>&1 | Out-Null
          }
          try {
            Set-LocalUser -Name $user -PasswordNeverExpires $true -ErrorAction SilentlyContinue
          } catch {
            wmic useraccount where name=\"$user\" set PasswordExpires=FALSE 2>&1 | Out-Null
          }
          Write-Output 'WIN_USER_CONFIGURED'
        }
        "
      loop: "{{ effective_users }}"
      register: win_user_res
      changed_when: "'WIN_USER_CONFIGURED' in win_user_res.stdout"
      failed_when: win_user_res.rc != 0
      no_log: true

    - name: "[Windows] Add user to local Administrators group"
      when: 
        - os_type | default('linux') == 'windows'
        - item.sudo | default(true) | bool
      ansible.builtin.raw: >
        powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "
        $user = '{{ item.username }}';
        $adminGroups = @('Administrators', 'Администраторы');
        $added = $false;
        foreach ($grp in $adminGroups) {
          try {
            Add-LocalGroupMember -Group $grp -Member $user -ErrorAction Stop
            $added = $true
            break
          } catch {
            net localgroup $grp $user /add 2>&1 | Out-Null
            if ($LASTEXITCODE -eq 0) { $added = $true; break }
          }
        }
        if ($added) { Write-Output 'WIN_ADMIN_ADDED' } else { Write-Output 'WIN_ADMIN_EXISTS' }
        "
      loop: "{{ effective_users }}"
      register: win_group_res
      changed_when: "'WIN_ADMIN_ADDED' in win_group_res.stdout"
      failed_when: win_group_res.rc != 0
