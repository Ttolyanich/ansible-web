<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Slate to Dark Void -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Crimson Neon Accent Gradient -->
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Cyan Node Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Inner Plate Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#334155" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Deep Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Squircle Container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" filter="url(#dropShadow)"/>

  <!-- Subtle High-tech Grid / Node Ring -->
  <circle cx="64" cy="64" r="46" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 6" fill="none" opacity="0.6"/>
  <circle cx="64" cy="64" r="32" stroke="#1e293b" stroke-width="1.5" fill="none" opacity="0.8"/>

  <!-- Ansible Geometric Caliper / Lambda 'A' Shape -->
  <!-- Left Leg with terminal prompt styling -->
  <path d="M64 24 L30 96" stroke="#f1f5f9" stroke-width="9" stroke-linecap="round"/>
  
  <!-- Right Caliper Arm with neon glow -->
  <path d="M64 24 L98 96" stroke="url(#neonRed)" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Crossbar connecting the nodes -->
  <path d="M44 74 L84 74" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>

  <!-- Center Terminal Prompt Chevron '>_' (accent) -->
  <path d="M56 50 L64 57 L56 64" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="68" y1="64" x2="74" y2="64" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- High-tech Node Hubs (Ansible Endpoints) -->
  <!-- Top Apex Node (Active Target) -->
  <circle cx="64" cy="24" r="9" fill="url(#neonRed)" filter="url(#glow)"/>
  <circle cx="64" cy="24" r="4.5" fill="#ffffff"/>

  <!-- Bottom Left Node (Inventory Source) -->
  <circle cx="30" cy="96" r="8" fill="url(#neonCyan)" filter="url(#glow)"/>
  <circle cx="30" cy="96" r="4" fill="#ffffff"/>

  <!-- Bottom Right Node (Ansible Executor) -->
  <circle cx="98" cy="96" r="8" fill="url(#neonRed)" filter="url(#glow)"/>
  <circle cx="98" cy="96" r="4" fill="#ffffff"/>
</svg>
