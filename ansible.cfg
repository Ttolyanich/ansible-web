[defaults]
host_key_checking = False
retry_files_enabled = False
timeout = 5
task_timeout = 15
forks = 100

[ssh_connection]
retries = 0
pipelining = True
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -o ConnectionAttempts=1 -o ServerAliveInterval=3 -o ServerAliveCountMax=1 -o GSSAPIAuthentication=no -o TCPKeepAlive=yes -o BatchMode=yes
