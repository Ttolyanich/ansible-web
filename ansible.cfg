[defaults]
host_key_checking = False
retry_files_enabled = False
timeout = 15
task_timeout = 30
forks = 100

[ssh_connection]
retries = 1
pipelining = True
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o ConnectionAttempts=2 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o GSSAPIAuthentication=no -o TCPKeepAlive=yes -o BatchMode=yes
