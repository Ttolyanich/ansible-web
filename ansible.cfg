[defaults]
host_key_checking = False
retry_files_enabled = False
timeout = 15
task_timeout = 30
forks = 100
remote_tmp = /tmp/.ansible-${USER}/tmp
local_tmp = /tmp/.ansible/tmp
allow_world_readable_tmpfiles = True

[ssh_connection]
retries = 3
pipelining = True
ssh_args = -C -o ControlMaster=no -o ControlPersist=no -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o ConnectionAttempts=2 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o GSSAPIAuthentication=no -o TCPKeepAlive=yes -o HostKeyAlgorithms=+ssh-rsa,ssh-dss -o PubkeyAcceptedKeyTypes=+ssh-rsa,ssh-dss -o KexAlgorithms=+diffie-hellman-group1-sha1,diffie-hellman-group14-sha1 -o Ciphers=+aes128-cbc,3des-cbc,aes192-cbc,aes256-cbc

