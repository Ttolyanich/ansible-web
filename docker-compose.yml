services:
  ansible-web:
    image: ghcr.io/ttolyanich/ansible-web:latest
    build: .
    container_name: ansible-web
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-5050}:5050"
    environment:
      - SECRET_KEY=${SECRET_KEY:-ansible-web-secret-key-prod-super-secure}
      - FERNET_KEY=${FERNET_KEY:-}
      - ANSIBLE_FORKS=${ANSIBLE_FORKS:-100}
      - ANSIBLE_TIMEOUT=${ANSIBLE_TIMEOUT:-15}
      - OPENSSL_CONF=/app/openssl_legacy.cnf
    command: ["gunicorn", "--bind", "0.0.0.0:5050", "--workers", "1", "--threads", "8", "--timeout", "120", "--reload", "app:app"]
    volumes:
      - ./instance:/app/instance
      - ./playbooks:/app/playbooks
      - ./app.py:/app/app.py
      - ./models.py:/app/models.py
      - ./task_engine.py:/app/task_engine.py
      - ./zabbix_client.py:/app/zabbix_client.py
      - ./templates:/app/templates
      - ./static:/app/static
      - ./ansible.cfg:/app/ansible.cfg
      - ./openssl_legacy.cnf:/app/openssl_legacy.cnf

